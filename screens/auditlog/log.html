{{define "content"}}
{{with .Body}}
<h1>{{t "log.title"}}</h1>
<p class="muted">{{t "log.intro"}}</p>
{{if .Acts}}
<ul class="messages">
  {{range .Acts}}
  <li>
    <div class="meta"><span>{{.Time}}</span></div>
    <p>{{.Text}}</p>
  </li>
  {{end}}
</ul>
{{else}}
<p class="muted">{{t "log.empty"}}</p>
{{end}}
{{end}}
{{end}}
