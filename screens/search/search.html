{{define "content"}}
<h1 class="sr">{{t "search.title"}}</h1>
<form class="busca" action="{{.Body.Action}}" method="get" role="search">
  {{icon "i-busca"}}
  <input type="search" name="q" value="{{.Query}}" placeholder="{{t "portal.search"}}" aria-label="{{t "portal.search"}}">
  <button type="submit">{{t "portal.search.button"}}</button>
</form>
{{with .Body}}
{{if not .Asked}}
<p class="muted">{{t "search.hint"}}</p>
{{else if .Results}}
<section class="lista">
  {{range .Results}}
  <div class="linha"><span class="tx"><span class="b">{{.Origin}}{{if .Author}} · {{.Author}}{{end}} · {{.Time}}</span><span class="a">{{.Text}}</span></span></div>
  {{end}}
</section>
{{else}}
<p class="muted">{{t "search.empty"}}</p>
{{end}}
{{end}}
{{end}}
