{{define "content"}}
{{with .Body}}
<h1>{{.Channel}}</h1>
{{if .Messages}}
<ul class="messages">
  {{range .Messages}}
  <li {{if .Mine}}class="mine"{{end}}>
    <div class="meta"><strong>{{.Author}}</strong><span>{{.Time}}</span></div>
    <p>{{.Text}}</p>
  </li>
  {{end}}
</ul>
{{else}}
<p class="muted">{{t "chat.empty"}}</p>
{{end}}
{{if .Error}}<p class="notice" role="alert">{{.Error}}</p>{{end}}
<form class="card" id="end" action="/chat" method="post">
  <label for="text">{{t "chat.message"}}</label>
  <textarea id="text" name="text" maxlength="{{.MaxText}}" required>{{.Draft}}</textarea>
  <button type="submit">{{t "chat.send"}}</button>
</form>
{{end}}
{{end}}
