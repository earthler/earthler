<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Maps: o mapa da comunidade</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen" data-app="maps">
  <div class="map full" data-map="0 0 390 768" data-land data-garden data-alert data-houses data-me role="img" aria-label="Mapa da Vila Aurora com um aviso de fogo na mata, a horta coletiva e a sua divisa, a escola, duas casas marcadas, a bomba solar, uma nascente, um relato e uma nota">
    <span class="pin sun big" style="left:306px;top:286px;box-shadow:0 0 0 3px var(--surface),0 2px 8px var(--shadow)"><span><i data-icon="bell"></i></span></span>
    <span class="pin home" style="left:258px;top:504px"><span><i data-icon="home" class="s"></i></span></span>
    <span class="pin home" style="left:80px;top:532px"><span><i data-icon="home" class="s"></i></span></span>
    <span class="pin primary" style="left:212px;top:268px"><span><i data-icon="tool" class="s"></i></span></span>
    <span class="pin water" style="left:342px;top:442px"><span><i data-icon="drop" class="s"></i></span></span>
    <span class="pin sun" style="left:112px;top:626px"><span><i data-icon="siren" class="s"></i></span></span>
    <span class="pin note" style="left:146px;top:398px"><span><i data-icon="wiki" class="s"></i></span></span>
  </div>

  <div class="float" style="left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span class="app-chip"><span data-glyph="maps"></span>Maps</span>
      <a class="community chip-on-map" href="#" style="min-height:44px;padding:0 14px;color:var(--primary)"><img data-mark alt="">Vila Aurora</a>
    </div>
    <div class="search" role="search"><i data-icon="search"></i>Buscar um lugar</div>
    <a class="card" href="#" style="flex-direction:row;align-items:center;gap:12px;padding:12px 14px;box-shadow:0 0 0 3px var(--sun),0 2px 10px var(--shadow)">
      <span class="avatar sun"><span style="position:relative;width:20px;height:20px"><i data-icon="bell" class="s"></i></span></span>
      <span class="tx"><span class="small" style="font-size:13px">Aviso de emergência, há 4 minutos</span><span class="a">Fogo na mata perto da estrada do rio</span></span>
      <span style="position:relative;width:22px;height:22px;flex:none"><i data-icon="next"></i></span>
    </a>
  </div>

  <div class="float" style="right:12px;top:586px">
    <button class="map-btn" aria-label="Camadas do mapa"><i data-icon="layers"></i></button>
  </div>
  <div class="float" style="left:12px;top:700px">
    <button class="map-btn on" aria-label="Mostrar onde estou"><i data-icon="locate"></i></button>
  </div>

  <a class="fab" href="#" style="color:var(--on-primary)"><i data-icon="plus"></i>Marcar</a>

  <nav class="bar" aria-label="Maps">
    <a class="on" href="#" aria-current="page"><span class="pad"><i data-icon="pin"></i></span>Mapa</a>
    <a href="#"><span class="pad"><i data-icon="list"></i></span>Lugares</a>
    <a href="#"><span class="pad"><i data-icon="area"></i></span>Terras</a>
  </nav>
</main>
<script src="../../kit.js"></script>
</body>
</html>
