<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Learn: editar uma página</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen" data-app="learn">
  <header class="inner">
    <a class="back" href="#" aria-label="Voltar"><i data-icon="back"></i></a>
    <div class="tx">
      <h1>Editar página</h1>
      <span class="sub">Composteira de três caixas</span>
    </div>
  </header>

  <form class="content" style="gap:12px">
    <div class="segmented" role="tablist" style="box-shadow:inset 0 0 0 1px var(--line)">
      <span class="on" role="tab" aria-selected="true">Escrever</span>
      <span role="tab" aria-selected="false">Prévia</span>
    </div>

    <div class="field">
      <label for="t">Título</label>
      <input class="input" id="t" value="Composteira de três caixas">
    </div>

    <div class="field" style="flex:1;min-height:0">
      <label for="x">Texto</label>
      <textarea class="input area" id="x" style="resize:none;flex:1;line-height:1.45">A primeira caixa recebe o que chega da cozinha. Quando enche, tudo passa para a segunda, onde o material esquenta. A terceira guarda o composto maduro.

## O que entra

Restos de frutas e verduras, folhas secas e serragem sem tinta.</textarea>
    </div>

    <div class="field">
      <label for="m">O que você mudou</label>
      <input class="input" id="m" value="Acrescentei serragem sem tinta">
    </div>

    <button class="btn block" type="submit">Salvar nova versão</button>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
