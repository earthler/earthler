<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Learn: publicar uma aula</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen" data-app="learn">
  <header class="inner">
    <a class="back" href="#" aria-label="Voltar"><i data-icon="back"></i></a>
    <div class="tx">
      <h1>Publicar aula</h1>
      <span class="sub">Para ensinar o que você sabe</span>
    </div>
  </header>

  <form class="content" style="gap:14px">
    <div class="card" style="flex-direction:row;align-items:center;gap:12px;padding:12px 14px">
      <span class="picture" style="width:72px;height:48px;flex:none;border-radius:10px"><svg viewBox="0 0 72 48" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><circle cx="50" cy="16" r="8" style="fill:var(--sun)"/><path d="M0 34 C18 26 40 27 72 34 V48 H0 Z" style="fill:var(--soft)"/></svg></span>
      <span class="tx"><span class="a" style="font-size:15px">Vídeo escolhido</span><span class="b">14 minutos, 380 MB</span></span>
      <button class="btn ghost small" type="button" style="color:var(--primary)">Trocar</button>
    </div>

    <div class="field">
      <label for="t">Título</label>
      <input class="input" id="t" value="Como afiar a enxada">
    </div>

    <div class="field">
      <label for="s">Assunto</label>
      <div class="input" id="s" role="combobox" aria-expanded="false" style="justify-content:space-between">Terra<i data-icon="down"></i></div>
    </div>

    <div class="field">
      <label for="d">O que a pessoa vai aprender</label>
      <textarea class="input area" id="d" style="resize:none;min-height:84px">O ângulo da lima, como segurar com segurança e quando trocar o cabo.</textarea>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between" class="label"><span>Sua cota de aulas</span><span>1,2 de 2 GB</span></div>
      <span class="progress"><span style="width:60%"></span></span>
      <p class="hint">Esta aula usa cerca de 380 MB. Depois de enviada, o vídeo é convertido, um de cada vez.</p>
    </div>

    <button class="btn block" type="submit" style="margin-top:auto">Enviar</button>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
