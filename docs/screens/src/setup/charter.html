<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Configuração: a carta da comunidade, primeira regra</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen">
  <header style="display:flex;align-items:center;gap:12px;padding:18px 20px 0">
    <img data-mark alt="" style="width:34px;height:28px;object-fit:contain">
    <span class="progress" style="flex:1" role="progressbar" aria-label="Configuração" aria-valuemin="1" aria-valuemax="15" aria-valuenow="7"><span style="width:47%"></span></span>
    <span class="small" style="font-weight:600;white-space:nowrap">7 de 15</span>
  </header>

  <form class="content" style="padding:18px 20px 20px;gap:14px" action="#" method="post">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <p class="label">A carta da comunidade</p>
      <span class="chip line">Regra 1 de 16</span>
    </div>
    <h1 class="big-title" id="q">Como alguém entra na Vila Aurora</h1>

    <div role="radiogroup" aria-labelledby="q" style="display:flex;flex-direction:column;gap:10px">
      <label class="card" style="flex-direction:row;gap:12px;align-items:flex-start;box-shadow:inset 0 0 0 2px var(--primary)">
        <input type="radio" name="entry" value="invite" checked style="width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--primary)">
        <span class="tx"><span class="a">Convite de um morador</span><span class="b wrap">Sugestão. Quem já mora aqui responde por quem convida.</span></span>
      </label>
      <label class="card" style="flex-direction:row;gap:12px;align-items:flex-start">
        <input type="radio" name="entry" value="approval" style="width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--primary)">
        <span class="tx"><span class="a">Aprovação</span><span class="b wrap">A pessoa pede para entrar, e quem a carta escolher aprova.</span></span>
      </label>
      <label class="card" style="flex-direction:row;gap:12px;align-items:flex-start">
        <input type="radio" name="entry" value="open" style="width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--primary)">
        <span class="tx"><span class="a">Aberto a quem está na rede</span><span class="b wrap">O mais simples. Serve onde todos se conhecem.</span></span>
      </label>
    </div>

    <p class="small">A comunidade pode mudar cada regra depois. Agora é só o começo.</p>

    <div style="margin-top:auto;display:flex;gap:10px">
      <button class="btn soft" type="button" style="flex:0 0 38%">Voltar</button>
      <button class="btn" type="submit" style="flex:1">Continuar</button>
    </div>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
