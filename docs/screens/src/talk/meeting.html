<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Talk: reunião grande da comunidade</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen" data-app="talk" style="background:var(--talk-cover);color:var(--talk-ink)">
  <div style="padding:18px 20px 12px">
    <h1 style="font-size:24px;font-weight:800">Assembleia de novembro</h1>
    <p style="font-size:15px;color:var(--talk-sub)">Reunião da comunidade, 38 pessoas</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:0 14px;flex:1;min-height:0">
    <div class="card" role="note" style="background:var(--sun);color:var(--on-sun);flex-direction:row;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:16px">
      <i data-icon="eye"></i>
      <p style="font-size:14px;font-weight:600;line-height:1.4">Nesta reunião não há sigilo. O som e a imagem passam pelo sistema da comunidade. Nada é gravado.</p>
    </div>

    <div style="flex:1;min-height:0;border-radius:20px;background:var(--veil);display:flex;align-items:flex-end;padding:14px;font-size:17px;font-weight:700;box-shadow:0 0 0 3px var(--sun)">Neide está falando</div>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <div style="height:84px;border-radius:16px;background:var(--veil);display:flex;align-items:flex-end;padding:8px;font-size:14px;font-weight:700">Marta</div>
      <div style="height:84px;border-radius:16px;background:var(--veil);display:flex;align-items:flex-end;padding:8px;font-size:14px;font-weight:700">Joel</div>
      <div style="height:84px;border-radius:16px;background:var(--veil);display:flex;align-items:flex-end;padding:8px;font-size:14px;font-weight:700">Você</div>
      <div style="height:84px;border-radius:16px;background:var(--veil);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800">+35</div>
    </div>

    <div style="border-radius:16px;background:var(--veil);padding:12px 14px;display:flex;flex-direction:column;gap:4px">
      <h2 style="font-size:15px;font-weight:700">Para falar</h2>
      <p style="font-size:15px;color:var(--talk-sub)">Bia levantou a mão. Caio levantou a mão.</p>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;padding:16px 22px 26px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Ligar o microfone" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--veil);color:var(--talk-ink)"><i data-icon="mic"></i></button>Microfone
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Ligar a câmera" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--veil);color:var(--talk-ink)"><i data-icon="video"></i></button>Câmera
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Levantar a mão para falar" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--talk-ink);color:var(--talk-cover)"><i data-icon="hand"></i></button>Levantar a mão
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Sair da reunião" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--sun);color:var(--on-sun)"><i data-icon="close"></i></button>Sair
    </div>
  </div>
</main>
<script src="../../kit.js"></script>
</body>
</html>
