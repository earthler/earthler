<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Talk: conversa protegida de uma criança</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen" data-app="talk">
  <header class="inner">
    <a class="back" href="#" aria-label="Voltar às conversas"><i data-icon="back"></i></a>
    <div class="tx">
      <h1>Neide</h1>
      <p class="sub"><i data-icon="shield" class="s"></i>Conversa protegida</p>
    </div>
    <a class="icon-btn on" href="#" aria-label="Ligar para Neide"><i data-icon="phone"></i></a>
  </header>

  <div style="padding:12px 14px 0">
    <section class="card soft" style="flex-direction:row;align-items:flex-start;gap:12px">
      <i data-icon="shield"></i>
      <p style="font-size:15px;line-height:1.4">Rita, responsável por você, pode ler esta conversa. Por isso aqui não dá para editar, apagar nem encaminhar.</p>
    </section>
  </div>

  <div class="thread" aria-label="Mensagens">
    <span class="day">Hoje</span>

    <div class="bubble">
      Dani, a aula de amanhã vai ser na horta.
      <span class="h">16h10</span>
    </div>

    <div class="bubble me">
      Posso levar a minha lupa?
      <span class="h">16h12</span>
    </div>

    <div class="bubble">
      Pode! Vamos procurar joaninhas nas couves.
      <span class="h">16h13</span>
    </div>

    <div class="bubble me">
      Eba! Até amanhã.
      <span class="h">16h14</span>
    </div>
  </div>

  <form class="compose" action="#">
    <a class="round soft" href="#" role="button" aria-label="Anexar foto"><i data-icon="plus"></i></a>
    <label class="input" aria-label="Mensagem"><span class="ph">Mensagem</span></label>
    <button class="round" type="button" aria-label="Gravar mensagem de voz" style="border:0;padding:0"><i data-icon="mic"></i></button>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
