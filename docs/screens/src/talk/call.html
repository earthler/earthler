<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Talk: chamada em andamento</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen" data-app="talk" style="background:var(--talk-cover);color:var(--talk-ink)">
  <div style="padding:18px 20px 12px">
    <h1 style="font-size:24px;font-weight:800">Conselho da água</h1>
    <p style="font-size:15px;color:var(--talk-sub)">4 de 5 pessoas, 12 minutos</p>
  </div>

  <div style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px" aria-label="Quem está na chamada">
    <div style="position:relative;border-radius:20px;background:var(--veil);display:flex;align-items:flex-end;padding:12px;font-weight:700">Bia</div>
    <div style="position:relative;border-radius:20px;background:var(--veil);display:flex;align-items:flex-end;padding:12px;font-weight:700;box-shadow:0 0 0 3px var(--sun)">Marta<span style="margin-left:6px;font-weight:400;font-size:13px;color:var(--talk-sub)">falando</span></div>
    <div style="position:relative;border-radius:20px;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px">
      <span class="avatar" style="width:64px;height:64px;border-radius:32px;font-size:24px;background:var(--talk-ink);color:var(--talk-cover)">C</span>
      <span style="font-weight:700">Caio</span>
      <span style="font-size:13px;color:var(--talk-sub)">Só com som</span>
    </div>
    <div style="position:relative;border-radius:20px;background:var(--veil);display:flex;align-items:flex-end;padding:12px;font-weight:700">Você</div>
  </div>

  <p style="display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px 2px;font-size:14px;color:var(--talk-sub)"><i data-icon="lock" class="s"></i>Som e imagem vão cifrados entre os aparelhos</p>

  <div style="display:flex;justify-content:space-between;padding:10px 22px 26px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Desligar o microfone" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--veil);color:var(--talk-ink)"><i data-icon="mic"></i></button>Microfone
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Desligar a câmera" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--veil);color:var(--talk-ink)"><i data-icon="video"></i></button>Câmera
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Chamar mais uma pessoa" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--veil);color:var(--talk-ink)"><i data-icon="plus"></i></button>Chamar mais
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600">
      <button class="round" type="button" aria-label="Sair da chamada" style="width:60px;height:60px;border-radius:30px;border:0;padding:0;background:var(--sun);color:var(--on-sun)"><i data-icon="close"></i></button>Sair
    </div>
  </div>
</main>
<script src="../../kit.js"></script>
</body>
</html>
