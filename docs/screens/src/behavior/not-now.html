<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Agora não, ao criar uma conta</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen">
  <div class="top">
    <a class="community" href="#"><img data-mark alt="">Vila Aurora</a>
  </div>

  <div class="content" style="padding:18px 20px 20px;gap:16px">
    <h1 class="big-title">Criar conta</h1>
    <p class="lead">Escolha o nome pelo qual as pessoas da comunidade conhecem você.</p>

    <div class="notice card" role="alert" style="flex-direction:row;align-items:flex-start">
      <i data-icon="clock"></i>
      <span style="display:flex;flex-direction:column;gap:2px"><strong>Agora não dá para criar a conta.</strong><span style="font-weight:400">Isso depende da ligação com toda a comunidade, e uma parte dela está sem ligação agora. Tente de novo daqui a pouco.</span></span>
    </div>

    <form class="card" action="#" method="post" style="gap:14px">
      <div class="field">
        <label for="name">Seu nome</label>
        <input class="input" id="name" name="name" value="Caio" maxlength="40" autocomplete="name">
      </div>
      <button class="btn block" type="submit">Entrar na comunidade</button>
    </form>
  </div>
</main>
<script src="../../kit.js"></script>
</body>
</html>
