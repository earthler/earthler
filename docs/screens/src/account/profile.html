<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Sua conta: nome, foto e preferências</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen">
  <header class="inner">
    <a class="back" href="#" aria-label="Voltar ao portal"><i data-icon="back"></i></a>
    <div class="tx"><h1>Sua conta</h1><span class="sub"><img data-mark alt="" style="width:16px;height:14px">Vila Aurora</span></div>
  </header>

  <div class="content">
    <section class="card" style="gap:14px">
      <div style="display:flex;align-items:center;gap:14px">
        <span class="avatar" style="width:64px;height:64px;border-radius:32px;font-size:24px;background:var(--soft);color:var(--on-soft)">A</span>
        <span class="tx"><span class="a" style="font-size:20px">Ana</span><span class="b">Apelido ana, moradora</span></span>
      </div>
      <div class="actions">
        <a class="btn small soft" href="#" style="color:var(--on-soft)"><i data-icon="camera" class="s"></i>Trocar a foto</a>
        <a class="btn small soft" href="#" style="color:var(--on-soft)"><i data-icon="edit" class="s"></i>Mudar o nome</a>
      </div>
    </section>

    <section class="list">
      <h2 class="label">Neste aparelho</h2>
      <div style="display:flex;flex-direction:column;gap:8px;padding:6px 0 12px;border-bottom:1px solid var(--line)">
        <span id="l-look" style="font-size:16px;font-weight:700">Aparência</span>
        <div class="segmented" role="radiogroup" aria-labelledby="l-look" style="background:var(--surface-2)">
          <span class="on" role="radio" aria-checked="true">Automática</span>
          <span role="radio" aria-checked="false">Clara</span>
          <span role="radio" aria-checked="false">Escura</span>
        </div>
      </div>
      <div class="row"><span class="tx"><span class="a">Letras maiores</span></span><span class="switch" role="switch" aria-checked="false" aria-label="Letras maiores"></span></div>
      <div class="row"><span class="tx"><span class="a">Avisos na tela do aparelho</span><span class="b">Só chegam quando há internet</span></span><span class="switch" role="switch" aria-checked="false" aria-label="Avisos na tela do aparelho"></span></div>
    </section>

    <nav class="list" aria-label="O que é seu">
      <a class="row" href="#"><span class="avatar sq" style="width:36px;height:36px;border-radius:10px"><i data-icon="lock" class="s"></i></span><span class="tx"><span class="a">Cofre</span></span><span style="display:flex;color:var(--muted)"><i data-icon="next" class="s"></i></span></a>
      <a class="row" href="#"><span class="avatar sq" style="width:36px;height:36px;border-radius:10px"><i data-icon="device" class="s"></i></span><span class="tx"><span class="a">Aparelhos</span></span><span class="small">2</span><span style="display:flex;color:var(--muted)"><i data-icon="next" class="s"></i></span></a>
      <a class="row" href="#"><span class="avatar sq" style="width:36px;height:36px;border-radius:10px"><i data-icon="people" class="s"></i></span><span class="tx"><span class="a">Pessoas de confiança</span></span><span class="chip sun" style="align-self:center">1 pedido</span><span style="display:flex;color:var(--muted)"><i data-icon="next" class="s"></i></span></a>
      <a class="row" href="#"><span class="avatar sq" style="width:36px;height:36px;border-radius:10px"><i data-icon="door" class="s"></i></span><span class="tx"><span class="a">Sair da comunidade</span></span><span style="display:flex;color:var(--muted)"><i data-icon="next" class="s"></i></span></a>
    </nav>
  </div>
</main>
<script src="../../kit.js"></script>
</body>
</html>
