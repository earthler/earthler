<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Entrar: muitas tentativas</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen">
  <div class="top">
    <span class="community"><img data-mark alt="">Vila Aurora</span>
  </div>

  <form class="content" style="gap:14px;padding-top:4px">
    <h1 class="big-title">Entrar</h1>

    <section class="card ring" role="alert" style="flex-direction:row;align-items:flex-start;gap:12px">
      <i data-icon="clock"></i>
      <p style="font-size:15px;line-height:1.42">Muitas tentativas seguidas. Espere 4 minutos para tentar de novo. A sua conta não foi bloqueada.</p>
    </section>

    <div class="field">
      <label id="l-nick">Apelido</label>
      <div class="input" role="textbox" aria-labelledby="l-nick">ana</div>
    </div>
    <div class="field">
      <label id="l-phrase">Frase secreta, as 7 palavras</label>
      <div class="input area" role="textbox" aria-multiline="true" aria-labelledby="l-phrase" aria-disabled="true" style="background:var(--surface-2)"><span class="ph">abacate janela tijolo…</span></div>
    </div>

    <button class="btn block" type="submit" disabled aria-disabled="true" style="background:var(--track);color:var(--muted)">Entrar em 3:52</button>
    <a class="btn block ghost" href="#" style="color:var(--primary)">Esqueci minha frase</a>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
