<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Entrar: a frase não confere</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen">
  <div class="top">
    <span class="community"><img data-mark alt="">Vila Aurora</span>
  </div>

  <form class="content" style="gap:14px;padding-top:4px">
    <h1 class="big-title">Entrar</h1>
    <p class="lead">Para usar a sua conta neste aparelho.</p>

    <div class="field">
      <label id="l-nick">Apelido</label>
      <div class="input" role="textbox" aria-labelledby="l-nick">ana</div>
    </div>
    <div class="field">
      <label id="l-phrase">Frase secreta, as 7 palavras</label>
      <div class="input area" role="textbox" aria-multiline="true" aria-labelledby="l-phrase" aria-invalid="true" aria-describedby="e-phrase" style="border:2px solid var(--danger)">abacate janela tijolo nuvem cerra farol colher</div>
      <p class="error" id="e-phrase" role="alert">O apelido ou a frase não conferem. Confira as 7 palavras e tente de novo.</p>
    </div>

    <button class="btn block" type="submit">Entrar</button>
    <a class="btn block ghost" href="#" style="color:var(--primary)">Esqueci minha frase</a>

    <p class="small" style="margin-top:auto;text-align:center">Ainda não mora aqui? <a href="#" style="color:var(--primary);font-weight:700">Criar conta</a></p>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
