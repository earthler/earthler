<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Sua frase secreta: conferir duas palavras</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<main class="screen">
  <div class="top">
    <span class="community"><img data-mark alt="">Vila Aurora</span>
  </div>

  <form class="content" style="gap:14px;padding-top:4px">
    <p class="label">Criar conta, passo 3 de 3</p>
    <h1 class="big-title">Confira duas palavras</h1>
    <p class="lead">Olhe o papel e escreva as palavras que a página pede.</p>

    <div class="field">
      <label id="l-w3">Palavra 3</label>
      <div class="input" role="textbox" aria-labelledby="l-w3" style="justify-content:space-between">tijolo<span style="display:flex;color:var(--primary)"><i data-icon="check"></i></span></div>
    </div>
    <div class="field">
      <label id="l-w6">Palavra 6</label>
      <div class="input" role="textbox" aria-labelledby="l-w6" aria-invalid="true" aria-describedby="e-w6" style="border:2px solid var(--danger)">faro</div>
      <p class="error" id="e-w6">A palavra 6 não confere. Olhe o papel e tente de novo.</p>
    </div>

    <button class="btn block" type="submit" style="margin-top:auto">Criar a minha conta</button>
    <a class="btn block ghost" href="#" style="color:var(--muted)">Ver a frase de novo</a>
  </form>
</main>
<script src="../../kit.js"></script>
</body>
</html>
